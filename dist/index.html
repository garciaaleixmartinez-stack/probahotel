<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>PAUta · Prepara la selectivitat</title>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#3A3A3C; --muted:#6E6E73; --line:#E3E3E8; --soft:#F0F0F2;
  --accent:#0066CC; --accent-soft:#E8F1FC; --ok:#1E7B34; --ok-soft:#E7F5EA; --warn:#A33A00; --warn-soft:#FDEEE4;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E9EE;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:3px solid #7FB2F0;outline-offset:2px;border-radius:8px}
.app{position:relative;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.app{height:min(100dvh,920px);margin-top:max(0px,calc((100dvh - 920px)/2));border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.18)}}
.scroll>*{flex-shrink:0}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(28px,env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;gap:18px}
.white{background:#fff}
h1.large{margin:0;font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.12}
h1.title{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.sub{margin:0;font-size:16px;color:var(--muted);line-height:1.45}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px}
.card.dark{background:#1D1D1F;color:#fff}
.card.dark .small,.card.dark .eyebrow{color:#C7C7CC}
.list{background:var(--card);border-radius:18px;overflow:hidden}
.list.gray{background:var(--bg)}
.li{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:56px;border:none;border-bottom:1px solid #EFEFF2;background:transparent;width:100%;text-align:left}
.li:last-child{border-bottom:none}
.li .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t{font-size:16px;font-weight:600}
.li .d{font-size:13px;color:var(--muted)}
.btn{min-height:52px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default}
.btn.secondary{background:var(--accent-soft);color:#004C99}
.btn.ghost{background:transparent;color:var(--accent);min-height:44px}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.block{width:100%}
.seg{background:#E3E3E8;border-radius:10px;padding:2px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{min-height:36px;border:none;border-radius:8px;background:transparent;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:none;background:var(--soft);font-size:15px;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.chip[disabled]{opacity:.45;cursor:default}
.opt{min-height:72px;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.opt[aria-pressed=true]{border-color:var(--accent);background:#F2F7FD}
.opt .grow{flex:1;display:flex;flex-direction:column;gap:3px}
.opt .t{font-size:17px;font-weight:700}
.opt .d{font-size:14px;color:var(--muted)}
.radio{width:24px;height:24px;border-radius:12px;border:2px solid #C7C7CC;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
[aria-pressed=true] .radio,[aria-checked=true] .radio{background:var(--accent);border-color:var(--accent)}
.field{background:var(--bg);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.list .field{background:transparent;border-radius:0;border-bottom:1px solid #EFEFF2}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:none;background:transparent;font-size:18px;font-weight:600;padding:4px 0;outline:none;width:100%}
.inline-field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;min-height:54px;border-bottom:1px solid #EFEFF2;font-size:16px}
.inline-field:last-child{border-bottom:none}
.inline-field input{width:84px;border:none;background:var(--soft);border-radius:10px;padding:8px 10px;text-align:right;font-size:16px;font-weight:600}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px;white-space:nowrap}
.badge.ok{background:#CFF3DA;color:#0B3D1A}.badge.warn{background:#FFE2B8;color:#3D2A00}.badge.muted{background:#E5E5EA;color:#1D1D1F}
.dot{width:10px;height:10px;border-radius:5px;flex:0 0 auto}
.check{width:28px;height:28px;border-radius:14px;border:2px solid #C7C7CC;background:transparent;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.check[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.94);border-top:1px solid var(--line);padding:6px 6px max(14px,env(safe-area-inset-bottom));backdrop-filter:saturate(180%) blur(20px)}
.tabbar button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;min-height:48px}
.tabbar button[aria-current=page]{color:var(--accent)}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 12px 0}
.icon-btn{width:44px;height:44px;border:none;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.avatar{width:44px;height:44px;border-radius:22px;border:none;background:#E3E3E8;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
.progress-seg{flex:1;display:grid;gap:6px}
.progress-seg i{height:4px;border-radius:2px;background:var(--line)}
.progress-seg i.on{background:var(--accent)}
.footer{flex:0 0 auto;padding:12px 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:inherit}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{min-height:62px;border:none;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.week button .w{font-size:12px;font-weight:600;color:var(--muted)}
.week button .n{font-size:18px;font-weight:700}
.week button .p{width:5px;height:5px;border-radius:3px;background:transparent}
.week button.has .p{background:var(--accent)}
.week button[aria-pressed=true]{background:var(--accent);color:#fff}
.week button[aria-pressed=true] .w{color:#DCE9F8}
.week button[aria-pressed=true] .p{background:#fff}
.week button.today:not([aria-pressed=true]) .n{color:var(--accent)}
.session{display:flex;gap:12px;align-items:stretch}
.session .time{width:44px;flex:0 0 auto;padding-top:16px;font-size:13px;font-weight:600;color:var(--muted);text-align:right}
.session .box{flex:1;min-width:0;background:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;border:none;text-align:left}
.session .box .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.session .stripe{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto}
.done .t{text-decoration:line-through;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .col i{display:block;width:100%;border-radius:6px;background:#B7D3F2;min-height:3px}
.chart .col i.hi{background:var(--accent)}
.chart .col span{font-size:11px;font-weight:600;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted)}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;z-index:20;animation:fade .2s ease}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet>*{flex-shrink:0}
.grabber{width:36px;height:5px;border-radius:3px;background:#D1D1D6;margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.timer{font-size:64px;font-weight:800;letter-spacing:-2px;text-align:center;font-variant-numeric:tabular-nums}
.q-opt{min-height:56px;padding:12px 16px;border-radius:16px;border:2px solid #fff;background:#fff;font-size:16px;font-weight:600;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.q-opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.q-opt.wrong{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.flash{min-height:340px;border:none;border-radius:28px;background:#fff;padding:26px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.08);width:100%}
.flash.back{background:var(--accent);color:#fff}
.flash .big{font-size:24px;font-weight:800;line-height:1.25;letter-spacing:-.4px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;z-index:30;animation:fade .2s ease;max-width:88%;text-align:center}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);padding:2px;display:flex;flex:0 0 auto;transition:background .2s}
.switch i{width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
[aria-checked=true] .switch{background:#34C759}
[aria-checked=true] .switch i{transform:translateX(20px)}
.phase-line{display:grid;gap:4px}
.phase-line i{height:6px;border-radius:3px;background:var(--line)}
.phase-line i.past{background:#B7D3F2}.phase-line i.now{background:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:15px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Scroll feed */
.feed-head{flex:0 0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chips.nowrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips.nowrap::-webkit-scrollbar{display:none}
.chip.sm{min-height:36px;padding:0 14px;font-size:14px;white-space:nowrap;flex:0 0 auto}
.scroll.feed{display:block;padding:0;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.scroll.feed::-webkit-scrollbar{display:none}
.fwrap{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:4px 16px 14px;display:flex}
.fcard{flex:1;min-height:0;background:#fff;border-radius:28px;padding:22px 20px 16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);border-top:6px solid var(--c)}
.fq{margin:0;font-size:23px;font-weight:800;line-height:1.28;letter-spacing:-.4px}
.pill{font-size:13px;font-weight:700;padding:5px 11px;border-radius:12px}
.q-opt.soft{background:var(--bg);border-color:var(--bg)}
.q-opt.soft.right{border-color:var(--ok);background:var(--ok-soft)}
.q-opt.soft.wrong{border-color:var(--warn);background:var(--warn-soft)}
.explain{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;color:var(--ink2)}
.fflip{flex:1;min-height:220px;border:none;border-radius:22px;background:var(--bg);padding:22px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);transition:background .25s}
.fflip.back{color:#fff}
.fhint{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#AEAEB2}
.fhint.on{color:var(--accent)}
.fhint.on svg{transform:rotate(90deg)}
.star-btn{width:44px;height:44px;margin:-10px -10px -10px 0;border:none;background:transparent;color:#C7C7CC;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.star-btn[aria-pressed=true]{color:#B25000}

</style>
</head>

/* ============================================================
   PAUta · Generador del pla d'estudi
   Principis que aplica (els d'un professor de batxillerat):
   1. Fases: fonaments → consolidació amb exercicis PAU → simulacres
      cronometrats → repàs final sense temari nou.
   2. Pràctica intercalada: no es repeteix matèria en blocs seguits.
   3. Repàs espaiat: cada tema es repassa 1, 7 i 21 dies després.
   4. Més temps a les matèries que pesen més o on vas més fluix.
   5. Blocs curts amb descans i una sessió de recuperació activa diària.
   6. Correcció l'endemà de cada simulacre.

const DAY = 86400000;

function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

function diffDays(a, b) { return Math.round((parseIso(b) - parseIso(a)) / DAY); }
// 0 = dilluns … 6 = diumenge
function weekdayMon(iso) { return (parseIso(iso).getDay() + 6) % 7; }

function getRegion(id) { return REGIONS.find((r) => r.id === id) || null; }

function examDateFor(profile) {
  const r = getRegion(profile.region);
  return { date: (r && r.first) || DEFAULT_EXAM, estimated: !(r && r.first) };
}

/* Matèries de l'estudiant amb el seu pes */
function studentSubjects(profile, quizStats) {
  const r = getRegion(profile.region);
  const list = [];
  const add = (id, role, base) => {
    if (!id || !SUBJECTS[id] || list.some((x) => x.id === id)) return;
    const rating = (profile.ratings && profile.ratings[id]) || 2;
    let w = base * ({ 1: 1.45, 2: 1.2, 3: 1.0 }[rating] || 1.2);
    // Importància: pondera 0,2 per al grau que vol, o l'estudiant la marca com a clau
    const ponder2 = !!(profile.ponder && profile.ponder[id] === 0.2);
    const star = !!(profile.stars && profile.stars[id]);
    if (ponder2) w *= 1.2;
    if (star) w *= 1.2;
    const st = quizStats && quizStats[id];
    if (st && st.total >= 8 && st.correct / st.total < 0.6) w *= 1.15;
    list.push({ id, role, weight: w, rating, ponder2, star });
  };
  if (profile.level !== 'cfgs') {
    add('cas', 'access', 1.0);
    if (r && r.coLang && (!r.coOptional || profile.coLangOn)) add(CO_LANG_SUBJECT[r.coLang], 'access', 1.0);
    add(profile.foreign || 'eng', 'access', 1.0);
    add(profile.histOrFil || 'his', 'access', 1.0);
    add(profile.modSubject, 'access', 1.25);
  }
  (profile.admission || []).forEach((id) => add(id, 'admission', profile.level === 'cfgs' ? 1.0 : 0.85));
  return list;
}

function blockLayout(minutes) {
  if (minutes <= 30) return { main: [30], repas: 0 };
  if (minutes <= 60) return { main: [25, 25], repas: 10 };
  if (minutes <= 120) return { main: [35, 35, 35], repas: 15 };
  return { main: [40, 40, 40, 40], repas: 20 };
}

/* Selecció ponderada intercalada (smooth weighted round-robin) */
function makePicker(subjects) {
  const credit = {};
  subjects.forEach((s) => (credit[s.id] = 0));
  return function pick(available, avoid) {
    const pool = subjects.filter((s) => available(s.id));
    if (!pool.length) return null;
    const total = pool.reduce((a, s) => a + s.weight, 0);
    pool.forEach((s) => (credit[s.id] += s.weight));
    let cands = pool.filter((s) => !avoid.includes(s.id));
    if (!cands.length) cands = pool;
    cands.sort((a, b) => credit[b.id] - credit[a.id]);
    const best = cands[0];
    credit[best.id] -= total;
    return best.id;
  };
}

function generatePlan(profile, opts) {
  opts = opts || {};
  const quizStats = opts.quizStats || {};
  const start = profile.planStart || isoDate(new Date());
  const exam = examDateFor(profile);
  const subjects = studentSubjects(profile, quizStats);
  const layout = blockLayout(profile.minutes || 60);
  const days = profile.days || [true, true, true, true, true, false, false];
  const result = { start, exam: exam.date, estimated: exam.estimated, subjects, days: [], phases: [] };
  if (!subjects.length) return result;

  const span = diffDays(start, exam.date);
  if (span <= 0) return result;

  // Fases segons el temps disponible
  const finalDays = Math.min(7, Math.max(2, Math.round(span * 0.1)));
  const simDays = span >= 70 ? 35 : Math.max(0, Math.round(span * 0.25));
  const consDays = Math.max(0, Math.round((span - finalDays - simDays) * 0.3));
  const fonDays = Math.max(0, span - finalDays - simDays - consDays);
  const bounds = {
    fon: [start, addDays(start, fonDays)],
    cons: [addDays(start, fonDays), addDays(start, fonDays + consDays)],
    sim: [addDays(start, fonDays + consDays), addDays(exam.date, -finalDays)],
    final: [addDays(exam.date, -finalDays), exam.date]
  };
  result.phases = [
    { id: 'fon', name: 'Fonaments', desc: 'Aprendre tot el temari tema a tema', from: bounds.fon[0], to: bounds.fon[1] },
    { id: 'cons', name: 'Consolidació', desc: 'Exercicis tipus PAU per blocs', from: bounds.cons[0], to: bounds.cons[1] },
    { id: 'sim', name: 'Simulacres', desc: 'Exàmens complets cronometrats', from: bounds.sim[0], to: bounds.sim[1] },
    { id: 'final', name: 'Repàs final', desc: 'Sense temari nou: repàs i descans', from: bounds.final[0], to: bounds.final[1] }
  ].filter((p) => p.from < p.to);
  const phaseOf = (iso) => (iso < bounds.fon[1] ? 'fon' : iso < bounds.cons[1] ? 'cons' : iso < bounds.sim[1] ? 'sim' : 'final');

  // Dates d'estudi
  const dates = [];
  for (let i = 0; i < span; i++) {
    const iso = addDays(start, i);
    if (days[weekdayMon(iso)] || iso === addDays(exam.date, -1)) dates.push(iso);
  }
  const mainPerDay = layout.main.length;

  // Cua de teoria: sessions per tema segons pes
  const fonBlocks = dates.filter((d) => phaseOf(d) === 'fon').length * mainPerDay;
  const done0 = profile.topicsDoneAtStart || {};
  const remainingTopics = {};
  subjects.forEach((s) => (remainingTopics[s.id] = SUBJECTS[s.id].topics.slice(done0[s.id] || 0).map((t, k) => ({ topic: t, idx: (done0[s.id] || 0) + k }))));
  const demand = subjects.reduce((a, s) => a + s.weight * remainingTopics[s.id].length, 0) || 1;
  const queue = {};
  subjects.forEach((s) => {
    const topics = remainingTopics[s.id];
    const sess = Math.max(topics.length, Math.round((fonBlocks * s.weight * topics.length) / demand));
    const per = topics.length ? sess / topics.length : 0;
    queue[s.id] = [];
    let acc = 0;
    topics.forEach((t) => {
      const before = Math.round(acc); acc += per; const n = Math.max(1, Math.round(acc) - before);
      for (let p = 1; p <= n; p++) queue[s.id].push({ topic: t.topic, idx: t.idx, part: p, parts: n });
    });
  });

  const pick = makePicker(subjects);
  const reviews = {}; // data -> [{subj, topic}]
  const addReview = (iso, subj, topic) => { (reviews[iso] = reviews[iso] || []).push({ subj, topic }); };
  const consIdx = {}; subjects.forEach((s) => (consIdx[s.id] = 0));
  const consCount = {}; subjects.forEach((s) => (consCount[s.id] = 0));
  const simQueue = []; let simWeek = -1; let pendingCorrection = []; let simInProgress = null;
  const finalIdx = { i: 0 };
  let studyDayCounter = 0;

  dates.forEach((iso) => {
    const phase = phaseOf(iso);
    const items = [];
    const used = [];
    const isEve = iso === addDays(exam.date, -1);
    studyDayCounter++;
    const push = (o) => { o.id = iso + '#' + items.length; items.push(o); if (o.subj) used.push(o.subj); };

    if (isEve) {
      push({ type: 'final', subj: null, title: 'Repàs lleuger i descans', detail: 'Mira només esquemes i flashcards. Prepara el material i el DNI. Dorm 8 hores.', min: 30 });
      result.days.push({ date: iso, phase, items, reviews: [] });
      return;
    }

    // 30 min/dia: cada 4t dia d'estudi és de repàs actiu
    const shortRepasDay = layout.repas === 0 && studyDayCounter % 4 === 0 && phase !== 'final';

    if (phase === 'sim') {
      const wk = Math.floor(diffDays(bounds.sim[0], iso) / 7);
      if (wk !== simWeek) {
        simWeek = wk;
        subjects.slice().sort((a, b) => b.weight - a.weight).forEach((s) => { if (!simQueue.includes(s.id)) simQueue.push(s.id); });
      }
    }

    let blocks = layout.main.slice();
    if (shortRepasDay) {
      push({ type: 'repas', subj: null, title: 'Repàs actiu', detail: 'Flashcards pendents i repàs espaiat dels temes recents.', min: blocks[0] });
      blocks = [];
    }

    // Correcció del simulacre d'ahir
    if (phase === 'sim' && pendingCorrection.length && blocks.length) {
      const s = pendingCorrection.shift();
      push({ type: 'correccio', subj: s, title: 'Correcció del simulacre', detail: 'Corregeix amb els criteris oficials i apunta els errors.', min: blocks.shift() });
    }

    // Simulacre (90 min; si el dia és curt, en parts consecutives)
    if (phase === 'sim' && blocks.length && (simInProgress || simQueue.length)) {
      const sum = blocks.reduce((a, b) => a + b, 0);
      if (simInProgress) {
        const sp = simInProgress;
        sp.part++;
        push({ type: 'simulacre', subj: sp.s, title: 'Simulacre (part ' + sp.part + ' de ' + sp.parts + ')', detail: 'Continua l’examen amb el cronòmetre en marxa.', min: sum });
        blocks = [];
        if (sp.part >= sp.parts) { pendingCorrection.push(sp.s); simInProgress = null; }
      } else if (sum >= 90) {
        const s = simQueue.shift();
        let acc = 0; let n = 0;
        while (acc < 90 && n < blocks.length) { acc += blocks[n]; n++; }
        blocks.splice(0, n);
        push({ type: 'simulacre', subj: s, title: 'Simulacre complet', detail: 'Examen oficial d’un any anterior, 90 minuts cronometrats.', min: 90 });
        pendingCorrection.push(s);
      } else if (studyDayCounter % 2 === 0) {
        // Dies curts: simulacre en parts cada dos dies d’estudi
        const s = simQueue.shift();
        const parts = Math.ceil(90 / sum);
        push({ type: 'simulacre', subj: s, title: 'Simulacre (part 1 de ' + parts + ')', detail: 'Fes l’examen per parts amb el cronòmetre en marxa.', min: sum });
        blocks = [];
        if (parts > 1) simInProgress = { s, part: 1, parts }; else pendingCorrection.push(s);
      }
    }

    blocks.forEach((len) => {
      // Teoria només si hi ha una matèria diferent de la del bloc anterior (pràctica intercalada)
      const last = used[used.length - 1];
      const theoryOk = (id) => queue[id].length > 0 && id !== last;
      if ((phase === 'fon' || phase === 'cons') && Object.keys(queue).some(theoryOk)) {
        const s = pick(theoryOk, []);
        if (s) {
          const q = queue[s].shift();
          const title = q.parts > 1 ? q.topic + ' (' + q.part + '/' + q.parts + ')' : q.topic;
          push({ type: 'teoria', subj: s, topic: q.topic, topicIdx: q.idx, lastPart: q.part === q.parts, title, detail: 'Estudia el tema i fes-ne l’esquema.', min: len });
          if (q.part === q.parts) { addReview(addDays(iso, 1), s, q.topic); addReview(addDays(iso, 7), s, q.topic); addReview(addDays(iso, 21), s, q.topic); }
          return;
        }
      }
      if (phase === 'final') {
        const s = subjects[finalIdx.i++ % subjects.length].id;
        push({ type: 'final', subj: s, title: 'Repàs final', detail: 'Esquemes, fórmules i flashcards. Res de temari nou.', min: len });
        return;
      }
      // Consolidació (i blocs lliures dels simulacres): exercicis per tema
      const s = pick(() => true, used.slice(-1));
      consCount[s]++;
      if (consCount[s] % 4 === 0) {
        push({ type: 'correccio', subj: s, title: 'Llista d’errors', detail: 'Torna a fer els exercicis que vas fallar.', min: len });
      } else {
        const topics = SUBJECTS[s].topics;
        const t = topics[consIdx[s]++ % topics.length];
        push({ type: 'exercicis', subj: s, topic: t, title: 'Exercicis PAU: ' + t, detail: 'Exercicis d’exàmens oficials d’aquest bloc.', min: len });
      }
    });

    if (layout.repas && !shortRepasDay) {
      push({ type: 'repas', subj: null, title: 'Repàs actiu', detail: 'Flashcards pendents i repàs espaiat.', min: layout.repas });
    }
    result.days.push({ date: iso, phase, items, reviews: [] });
  });

  // Assigna repassos espaiats al dia d'estudi següent disponible
  const dayIndex = {}; result.days.forEach((d, i) => (dayIndex[d.date] = i));
  Object.keys(reviews).sort().forEach((iso) => {
    let target = result.days.find((d) => d.date >= iso && d.date < addDays(exam.date, -1));
    if (target) target.reviews.push(...reviews[iso]);
  });
  return result;
}

/* ---------- Estat i persistència ---------- */
const KEY = 'pauta.v1';
function freshState() {
  return { v: 1, updatedAt: 0, profile: null, grades: { base: '', fg: '', adm: {} }, done: {}, topicsDone: {}, log: {}, quiz: {}, cards: {}, act: {}, milestones: [] };
}
let S = freshState();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(freshState(), JSON.parse(raw)); } catch (e) {}

let cloud = null; // {ref}
let cloudTimer = null;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (cloud) {
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(() => {
      cloud.ref.set({ json: JSON.stringify(S), updatedAt: S.updatedAt }).catch(() => {});
    }, 1500);
  }
}
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const user = await window.claude.use('user');
    const db = await window.claude.use('db');
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/app');
    const snap = await ref.get();
    cloud = { ref };
    if (snap.exists) {
      const d = snap.data();
      if (d && d.json && (d.updatedAt || 0) > (S.updatedAt || 0)) {
        S = Object.assign(freshState(), JSON.parse(d.json));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        planCache = null; render();
      } else if (S.profile) { save(); }
    } else if (S.profile) { save(); }
  } catch (e) { cloud = null; }
}

function admSubjects() {
  const pr = S.profile; const ids = [];
  if (pr.level !== 'cfgs' && pr.modSubject) ids.push(pr.modSubject);
  (pr.admission || []).forEach((x) => { if (!ids.includes(x)) ids.push(x); });
  return ids;
}
function calc() {
  const pr = S.profile; const g = S.grades; const r = getRegion(pr.region);
  const base = num(g.base); const fg = num(g.fg);
  let acces = null; let warn = '';
  if (pr.level === 'cfgs') acces = base;
  else if (base != null && fg != null) {
    if (fg < 4) warn = 'Cal un 4 o més de mitjana a la fase d’accés.';
    else acces = 0.6 * base + 0.4 * fg;
  }
  if (acces != null && acces < 5) warn = warn || 'La nota d’accés ha de ser 5 o més per superar la PAU.';
  const items = admSubjects().map((id) => {
    const a = g.adm[id] || {}; const n = num(a.grade); const w = a.w || 0.1;
    return { id, grade: n, w, val: n != null && n >= 5 ? n * w : 0 };
  }).filter((x) => x.val > 0).sort((a, b) => b.val - a.val);
  let picked = [];
  for (const it of items) {
    if (picked.length >= 2) break;
    if (r && r.rule === 'and-math' && it.w === 0.2 && (it.id === 'mat' || it.id === 'macs') && picked.some((p) => (p.id === 'mat' || p.id === 'macs') && p.w === 0.2)) continue;
    picked.push(it);
  }
  const extra = picked.reduce((a, b) => a + b.val, 0);
  const adm = acces != null && acces >= 5 ? acces + extra : null;
  return { acces, adm, extra, picked, warn };
}

function practiceSubjects() { return getPlan().subjects.map((s) => s.id).filter((id) => BANK[id]); }

function dueCards(subj) {
  const t = today(); const ids = subj ? [subj] : practiceSubjects();
  const out = [];
  ids.forEach((s) => allCards(s).forEach((c) => { const st = S.cards[c.key]; if (st && st.due <= t) out.push(c); }));
  return out;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function grade(key, ok) {

}

/* ---------- Ratxa ---------- */
const MILESTONES = [3, 7, 14, 30, 50, 75, 100, 150, 200];
function isActive(iso) { return (S.log[iso] || 0) > 0 || (S.act && S.act[iso] || 0) >= 5; }
function isRestDay(iso) { const d = S.profile && S.profile.days; return !!d && !d[weekdayMon(iso)]; }
// Recorregut cronològic: els dies de descans del teu horari no trenquen la ratxa;
// cada 7 dies seguits guanyes un protector (màx. 2) que salva un dia d’estudi perdut.
function streakInfo() {
  const t = today();
  const days = Object.keys(S.log).filter((k) => S.log[k] > 0).concat(Object.keys(S.act || {}).filter((k) => S.act[k] >= 5)).sort();
  const res = { current: 0, best: 0, freezes: 0, todayDone: isActive(t), status: {} };
  if (!days.length) return res;
  let d = days[0]; let cur = 0; let fz = 0; let best = 0;
  while (d <= t) {
    if (isActive(d)) { cur++; res.status[d] = 'done'; if (cur % 7 === 0) fz = Math.min(2, fz + 1); }
    else if (d === t) { res.status[d] = isRestDay(d) ? 'rest' : 'pending'; }
    else if (isRestDay(d)) { res.status[d] = 'rest'; }

/* ---------- Scroll (feed de targetes) ---------- */
function buildBatch(filter) {
  const subs = filter ? [filter] : practiceSubjects();
  if (!subs.length) return [];
  const due = shuffle(dueCards(filter || null).filter((c) => subs.includes(c.subj))).map((c) => ({ kind: 'flash', c }));
  const pools = {};
  const weights = {};
  const plan = getPlan();
  subs.forEach((s) => {
    pools[s] = shuffle(allCards(s));
    const ps = plan.subjects.find((x) => x.id === s);
    weights[s] = ps ? ps.weight : 1;
  });
  const out = due.slice(0, 8);
  const credit = {}; subs.forEach((s) => (credit[s] = 0));
  let last = out.length ? out[out.length - 1].c.subj : null;
  while (out.length < 24 && subs.some((s) => pools[s].length)) {
    const live = subs.filter((s) => pools[s].length);
    const tot = live.reduce((a, s) => a + weights[s], 0);
    live.forEach((s) => (credit[s] += weights[s]));
    let cands = live.filter((s) => s !== last); if (!cands.length) cands = live;
    cands.sort((a, b) => credit[b] - credit[a]);
    const s = cands[0]; credit[s] -= tot; last = s;
    const c = pools[s].shift();
    const st = S.cards[c.key];
    out.push({ kind: st && st.box >= 2 && Math.random() < 0.5 ? 'flash' : 'quiz', c, order: shuffle(c.q[1].map((_, i) => i)) });
  }
  return out;
}

  return U.feed;
}

function markDone(id) {
  const it = findItem(id); if (!it) return;
  const date = id.split('#')[0];
  if (S.done[id]) {
    delete S.done[id];
    S.log[date] = Math.max(0, (S.log[date] || 0) - it.min);
  } else {
    S.done[id] = true;
    S.log[date] = (S.log[date] || 0) + it.min;
    if (it.type === 'teoria' && it.lastPart) S.topicsDone[it.subj] = Math.max(S.topicsDone[it.subj] || 0, it.topicIdx + 1);
  }
  save();
}
function stopTimer() { clearInterval(U.timer.handle); U.timer.handle = null; U.timer.running = false; }

const ACT = {
  go(a) { U.view = a; U.sheet = null; if (a === 'pla') U.planDay = today(); render(); $('#main') && ($('#main').scrollTop = 0); },
  onbNext() { if (!onbCanContinue()) return; U.step = Math.min(ONB_STEPS - 1, U.step + 1); render(); },
  onbBack() { U.step = Math.max(0, U.step - 1); render(); },
  setRegion(a) { U.draft.region = a; U.draft.uni = null; render(); },
  setLevel(a) { U.draft.level = a; render(); },
  setModality(a) { const m = MODALITIES.find((x) => x.id === a); U.draft.modality = a; U.draft.modSubject = m.options.length === 1 ? m.options[0] : (m.options.includes(U.draft.modSubject) ? U.draft.modSubject : null); U.draft.admission = U.draft.admission.filter((x) => x !== U.draft.modSubject); render(); },
  setModSubject(a) { U.draft.modSubject = a; U.draft.admission = U.draft.admission.filter((x) => x !== a); render(); },
  setHist(a) { U.draft.histOrFil = a; U.draft.admission = U.draft.admission.filter((x) => x !== a); render(); },
  toggleCo() { U.draft.coLangOn = !U.draft.coLangOn; render(); },
  toggleAdm(a) { const d = U.draft; d.admission = d.admission.includes(a) ? d.admission.filter((x) => x !== a) : d.admission.concat(a).slice(0, 3); render(); },
  rate(a) { const [id, v] = a.split(':'); U.draft.ratings[id] = +v; render(); },
  toggleStar(a) { const d = U.draft; d.stars = d.stars || {}; if (d.stars[a]) delete d.stars[a]; else d.stars[a] = true; render(); },
  setPonder(a) { const [id, w] = a.split(':'); const d = U.draft; d.ponder = d.ponder || {}; if (+w) d.ponder[id] = +w; else delete d.ponder[id]; render(); },
  setUni(a) { U.draft.uni = U.draft.uni === a ? null : a; render(); },
  setMinutes(a) { U.draft.minutes = +a; render(); },
  toggleDay(a) { U.draft.days[+a] = !U.draft.days[+a]; render(); },
  onbFinish() {
    if (!onbCanContinue()) return;
    const d = U.draft; d.name = d.name.trim();
    const keep = draftSubjects(d); Object.keys(d.ratings).forEach((k) => { if (!keep.includes(k)) delete d.ratings[k]; });
    d.stars = d.stars || {}; Object.keys(d.stars).forEach((k) => { if (!keep.includes(k)) delete d.stars[k]; });
    const pk = draftPonderable(d); d.ponder = d.ponder || {}; Object.keys(d.ponder).forEach((k) => { if (!pk.includes(k)) delete d.ponder[k]; });
    // La calculadora de Nota parteix de la mateixa ponderació
    Object.keys(d.ponder).forEach((k) => { S.grades.adm[k] = Object.assign({}, S.grades.adm[k], { w: d.ponder[k] }); });
    d.planStart = today(); d.topicsDoneAtStart = Object.assign({}, S.topicsDone);
    S.profile = d; U.draft = null; U.view = 'home'; U.step = 0; planCache = null; save(); render();
  },
  editProfile() { U.draft = newDraft(); U.step = 1; U.view = 'onb'; render(); },
  toggleDone(a) { withActivity(() => markDone(a)); render(); },
  openSession(a) { U.sheet = { type: 'session', id: a }; render(); },
  closeSheet(a, ev) { if (ev && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act="closeSheet"]:not(.sheet-bg)') && ev.target.closest('.sheet')) return; U.sheet = null; render(); },
  timerToggle(a) {
    const it = findItem(a);
    if (U.timer.id !== a) { stopTimer(); U.timer = { running: false, left: it.min * 60, total: it.min * 60, handle: null, id: a }; }
    if (U.timer.running) { stopTimer(); render(); return; }
    U.timer.running = true;
    U.timer.handle = setInterval(() => {
      U.timer.left--;
      if (U.timer.left <= 0) { stopTimer(); U.timer.left = 0; if (!S.done[a]) withActivity(() => markDone(a)); toast('Sessió acabada, ' + S.profile.name + '. Fes 5 minuts de descans.'); }
      if (U.sheet && U.sheet.id === a) { const el = document.querySelector('.timer'); if (el) el.textContent = String(Math.floor(U.timer.left / 60)).padStart(2, '0') + ':' + String(U.timer.left % 60).padStart(2, '0'); }
    }, 1000);
    render();
  },
  timerReset(a) { const it = findItem(a); stopTimer(); U.timer = { running: false, left: it.min * 60, total: it.min * 60, handle: null, id: a }; render(); },
  pickDay(a) { U.planDay = a; render(); },
  weekShift(a) { U.planDay = addDays(U.planDay || today(), +a); render(); },
  replan() {
    S.profile.planStart = today(); S.profile.topicsDoneAtStart = Object.assign({}, S.topicsDone);
    planCache = null; save(); U.planDay = today(); toast('Pla refet des d’avui amb el temari que et queda'); },
  feedFilter(a) { U.feedFilter = a || null; U.feed = null; render(); const m = $('#main'); if (m) m.scrollTop = 0; },
  feedAnswer(a) {
    const [i, oi] = a.split(':').map(Number); const st = U.feed.state[i] = U.feed.state[i] || {};
    if (st.answer != null) return;
    const it = U.feed.items[i]; const ok = oi === it.c.q[2];
    st.answer = oi;
    withActivity(() => { logQuiz(it.c.subj, ok); S.act[today()] = (S.act[today()] || 0) + 1; grade(it.c.key, ok); save(); });
    render();
  },
  feedFlip(a) { const st = U.feed.state[+a] = U.feed.state[+a] || {}; st.flipped = !st.flipped; render(); },
  feedGrade(a) {
    const [i, ok] = a.split(':').map(Number); const st = U.feed.state[i] = U.feed.state[i] || {};
    if (st.graded != null) return;
    const it = U.feed.items[i]; st.graded = !!ok;
    withActivity(() => { grade(it.c.key, !!ok); S.act[today()] = (S.act[today()] || 0) + 1; save(); });
    render();
  },
  pMode(a) { U.practiceMode = a; render(); },
  pSubj(a) { U.practiceSubj = a; render(); },
  pSubjGo(a) { U.feedFilter = a; U.feed = null; U.view = 'practica'; U.sheet = null; render(); },
  startQuiz() {
    const s = U.practiceSubj; const bank = BANK[s];
    const items = shuffle(bank.map((q, i) => ({ q, i }))).slice(0, Math.min(10, bank.length)).map((x) => ({ q: x.q, i: x.i, order: shuffle([0, 1, 2, 3].slice(0, x.q[1].length)) }));
    U.quiz = { subj: s, items, i: 0, answer: null, score: 0 }; render();
  },
  answer(a) {
    const z = U.quiz; if (z.answer != null) return;
    const it = z.items[z.i]; const ok = +a === it.q[2];
    z.answer = +a; if (ok) z.score++;
    withActivity(() => { logQuiz(z.subj, ok); S.act[today()] = (S.act[today()] || 0) + 1; grade(z.subj + ':' + it.i, ok); save(); }); render();
  },
  nextQ() { U.quiz.i++; U.quiz.answer = null; render(); },
  startFlash() {
    const s = U.practiceSubj;
    const items = dueCards(s).concat(shuffle(newCards(s))).slice(0, 15);
    U.flash = { items, i: 0, flipped: false, known: 0 }; render();
  },
  flip() { U.flash.flipped = !U.flash.flipped; render(); },
  flashGrade(a) { const f = U.flash; const c = f.items[f.i]; const ok = a === '1'; withActivity(() => { grade(c.key, ok); S.act[today()] = (S.act[today()] || 0) + 1; save(); }); if (ok) f.known++; f.i++; f.flipped = false; render(); },
  closeOverlay() { U.quiz = null; U.flash = null; render(); },
  setW(a) {
    const [id, w] = a.split(':'); S.grades.adm[id] = Object.assign({}, S.grades.adm[id], { w: +w });
    // Mantén el pla al dia: les que ponderen 0,2 hi reben més temps
    S.profile.ponder = Object.assign({}, S.profile.ponder, { [id]: +w });
    save(); render();
  },
  async copyData() { try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Còpia de seguretat copiada'); } catch (e) { toast('No s’ha pogut copiar en aquest navegador'); } },
  askReset() { U.sheet = { type: 'confirm' }; render(); },
  doReset() { stopTimer(); S = freshState(); save(); U.view = 'onb'; U.step = 0; U.draft = null; U.sheet = null; planCache = null; render(); }
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.getAttribute('data-act');
  if (act === 'closeSheet' && el.classList.contains('sheet-bg') && ev.target.closest('.sheet')) return;
  if (ACT[act]) ACT[act](el.getAttribute('data-arg'), ev);
});
document.addEventListener('input', (ev) => {
  const el = ev.target; const b = el.getAttribute && el.getAttribute('data-bind'); if (!b) return;
  const [scope, key] = b.split('.');
  if (scope === 'draft') { U.draft[key] = el.value; const btn = document.querySelector('.footer .btn'); if (btn) btn.disabled = !onbCanContinue(); return; }
  if (scope === 'grades') S.grades[key] = el.value;
  else if (scope === 'adm') S.grades.adm[key] = Object.assign({ w: 0.1 }, S.grades.adm[key], { grade: el.value });
  else if (scope === 'profile') { S.profile[key] = el.value; }
  save(); refreshCalc();
});
document.addEventListener('scroll', (ev) => {
  const el = ev.target;
  if (!el.classList || !el.classList.contains('feed') || !U.feed) return;
  if (el.scrollTop + el.clientHeight * 3 >= el.scrollHeight) { feedMore(); render(); }
}, true);
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && U.sheet) { U.sheet = null; render(); } });

render();
initCloud();
})();
</script>
</body>
